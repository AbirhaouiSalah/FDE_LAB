name: Dashboard CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-branch-name:
    name: Validate branch name
    if: >-
      github.ref != 'refs/heads/main'
      && github.ref != 'refs/heads/ats-lab/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check branch name
        run: |
          set -euo pipefail
          B="${GITHUB_REF#refs/heads/}"
          RE='^(ats-lab/)?(comp|feat|fix|chore|docs|spike)/[a-z0-9-]+(/[a-z0-9-]+)?$'
          if [[ ! "$B" =~ $RE ]]; then
            echo "::error::Branch '$B' does not match naming convention"
            exit 1
          fi
          echo "Branch name ok: $B"

  lint-and-typecheck:
    name: Lint and typecheck
    needs: validate-branch-name
    if: >-
      always()
      && (needs.validate-branch-name.result == 'success'
          || needs.validate-branch-name.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit and component tests
    needs: [validate-branch-name, lint-and-typecheck]
    if: >-
      always()
      && (needs.lint-and-typecheck.result == 'success'
          || needs.lint-and-typecheck.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      - name: Run tests with coverage
        run: pnpm test -- --run --coverage
        continue-on-error: true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.ref_name }}
          path: coverage/
          if-no-files-found: ignore

  a11y-tests:
    name: A11y tests
    needs: [validate-branch-name, lint-and-typecheck]
    if: >-
      always()
      && (needs.lint-and-typecheck.result == 'success'
          || needs.lint-and-typecheck.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      - name: Run a11y tests
        run: pnpm test:a11y

  build:
    name: Build
    needs: [unit-tests, a11y-tests]
    if: >-
      always()
      && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
      && (needs.a11y-tests.result == 'success' || needs.a11y-tests.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      - name: Build
        run: pnpm build
      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  ci-report-and-commit:
    name: Report and auto-commit
    needs: [validate-branch-name, lint-and-typecheck, unit-tests, a11y-tests, build]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name  "AbirhaouiSalah"
          git config user.email "sabirhaouipro@gmail.com"
      - name: Prepare report folder
        run: mkdir -p .ci-reports
      - name: Write CI status report
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RES_VALIDATE: ${{ needs.validate-branch-name.result }}
          RES_LINT: ${{ needs.lint-and-typecheck.result }}
          RES_TESTS: ${{ needs.unit-tests.result }}
          RES_A11Y: ${{ needs.a11y-tests.result }}
          RES_BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          SAFE_BRANCH="${BRANCH//\//_}"
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > ".ci-reports/${SAFE_BRANCH}.md" <<EOF
          # CI Report — ${BRANCH}
          - **Commit:** \`${SHA}\`
          - **Actor:** ${ACTOR}
          - **Time:** ${TS}
          - **Run:** ${RUN_URL}
          EOF
      - name: Commit and push report
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain .ci-reports)" ]]; then
            git add .ci-reports
            git commit -m "ci: report for ${GITHUB_REF_NAME} @ ${GITHUB_SHA} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi