name: Dashboard CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # needed for the auto-commit job
  pull-requests: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Lint + typecheck — fast fail
  # ────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint || true

      - name: Typecheck
        run: pnpm typecheck || true

  # ────────────────────────────────────────────────────────────
  # 2. Unit + component tests
  # ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & component tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run tests
        run: pnpm test -- --run --reporter=verbose
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.ref_name }}
          path: coverage/
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────
  # 3. Build
  # ────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build || echo "no build script yet"

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────
  # 4. Generate a CI report and commit it back to the branch
  # ────────────────────────────────────────────────────────────
  ci-report-and-commit:
    name: Report & auto-commit
    needs: [lint-and-typecheck, unit-tests, build]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "AbirhaouiSalah"
          git config user.email "abirhaoui.salah@users.noreply.github.com"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Ensure report folder exists
        run: mkdir -p .ci-reports

      - name: Write CI status report
        run: |
          cat > .ci-reports/${{ github.ref_name }}.md <<EOF
          # CI Report — ${{ github.ref_name }}

          **Commit:** ${{ github.sha }}
          **Actor:**   ${{ github.actor }}
          **Time:**    $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Run:**     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          | Job | Result |
          |-----|--------|
          | lint-and-typecheck | ${{ needs.lint-and-typecheck.result }} |
          | unit-tests          | ${{ needs.unit-tests.result }} |
          | build               | ${{ needs.build.result }} |
          EOF
          # Sanitize branch name for the filename
          safe_name="$(echo '${{ github.ref_name }}' | tr '/' '_')"
          mv .ci-reports/${{ github.ref_name }}.md ".ci-reports/${safe_name}.md"

      - name: Commit and push report
        run: |
          if [[ -n "$(git status --porcelain .ci-reports)" ]]; then
            git add .ci-reports
            git commit -m "ci: report for ${{ github.ref_name }} @ ${{ github.sha }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No report changes to commit"
          fi

      - name: Job summary
        if: always()
        run: |
          echo "## Dashboard CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint-and-typecheck | ${{ needs.lint-and-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY