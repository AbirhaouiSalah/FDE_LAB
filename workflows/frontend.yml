name: Frontend CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  validate-branch-name:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="${GITHUB_REF#refs/heads/}"
          [[ "$B" =~ ^(comp|feat|fix|chore|docs|spike)/[a-z0-9-]+(/[a-z0-9-]+)?$ ]] || exit 1
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "pnpm lint"
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "pnpm test"
